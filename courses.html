<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Courses - Backend Software Engineer Portfolio">
  <title>Courses | Portfolio</title>

  <link id="theme-stylesheet" rel="stylesheet" href="themes/dark-hacker.css">
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>

<body>
  <div id="app">
    <!-- Navigation Bar (same structure as index.html) -->
    <nav id="navbar" class="navbar">
      <div class="nav-brand">
        <span id="nav-name"></span>
      </div>
      <div class="nav-links" id="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="projects.html" class="nav-link" id="nav-projects">Projects</a>
        <a href="courses.html" class="nav-link active" id="nav-courses">Courses</a>
        <a href="articles.html" class="nav-link" id="nav-articles">Articles</a>
      </div>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Page Header -->
      <header class="page-header">
        <h1 class="page-title">All Courses</h1>
      </header>

      <!-- Filter Tags -->
      <section class="filter-section">
        <div class="filter-container" id="filter-container">
          <button class="filter-tag active" data-filter="all">All</button>
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Courses Grid -->
      <section class="grid-section">
        <div class="cards-grid" id="courses-grid">
          <!-- Courses are loaded from config, no API fetching needed -->
          <!-- JS will render them directly -->
        </div>
      </section>

      <!-- Footer -->
      <footer class="footer">
        <p>© <span id="current-year"></span> • Built with passion</p>
      </footer>
    </main>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/config-loader.js"></script>
  <script src="js/github-fetcher.js"></script>
  <script src="js/metadata-fetcher.js"></script>
  <script src="js/skills-generator.js"></script>
  <script src="js/content-renderer.js"></script>
  <script src="js/page-courses.js"></script>
</body>

</html>
