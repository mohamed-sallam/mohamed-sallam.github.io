      description: "A simple CRUD middleware web application that manages transactions between banks. Developed during a 15-day Java/Spring Boot bootcamp by Egyptian Banking Institute. Led the team and implemented transactions feature using the command pattern."
      github_url: "https://github.com/mohamed-sallam/BanqueOfEgypt"
      tags:
        - Spring Boot
        - Spring MVC
        - Spring Data JPA
        - MySQL
        - Clean Architecture
        - Design Patterns
      featured: true
      
    - title: "StateLang"
      description: "A fork of State Machine Compiler (CC_SMC) by Uncle Bob. Enhanced SMC by adding support for diagramming languages such as PlantUML and Mermaid. Developed module to simplify inheritance tree using complex data structures and algorithms."
      github_url: "https://github.com/StateLang/StateLang"
      tags:
        - Java
        - Compiler Design
        - Design Patterns
        - UML
      featured: true
      
    - title: "LeetStream"
      description: "A static website for daily LeetCode practice with 26 coding patterns. Implemented custom spaced repetition algorithm and a lightweight ReactJS-like component utility using web components."
      github_url: "https://github.com/LeetStream/leetstream.github.io"
      image: "assets/leetStream.png"
      tags:
        - JavaScript
        - HTML/CSS
        - Algorithms
        - Web Components
      featured: true
      
    - title: "Al-Miqata"
