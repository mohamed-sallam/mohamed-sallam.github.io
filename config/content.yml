      github_url: "https://github.com/mohamed-sallam/Al-Miqata"
      image: "assets/Al-miqata.png"
      tags:
        - C
        - Embedded Systems
        - Circuit Design
      featured: true
      
    - title: "Awb"
      description: "Free and Open Source Android App to quit digital addiction. Led the team from requirement gathering (SRS) through design (CRC cards, ERD, DFD, UML diagrams) to implementation."
      github_url: "https://github.com/mohamed-sallam/awb-android"
      image: "assets/Awb.png"
      tags:
        - Android
        - Java
        - MVVM
        - Software Engineering
        - Scrum
      featured: true

