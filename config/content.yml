# ============================================
# Portfolio Configuration
# ============================================
# This is the main configuration file for your portfolio.
# Edit this file to customize your content.
# See DOCUMENTATION.md for full schema reference.

# --------------------------------------------
# Site Settings
# --------------------------------------------
site:
  # Available themes: liquid-glass, dark-hacker, windows-me, retro-japanese, scientific, professional
  theme: "windows-me"
  # Cache version: Change this number to invalidate all cached data (set to 0 to disable caching)
  cache_version: 4
  
# --------------------------------------------
# Page Toggles
# Set to false to disable entire pages
# --------------------------------------------
pages:
  projects: true
  courses: true
  articles: false

# --------------------------------------------
# Home Page Sections
# Control order and visibility of sections
# Reorder this list to change section order on homepage
# --------------------------------------------
home_sections:
  - id: "hero"
    enabled: true
  - id: "social_links"
    enabled: true
  - id: "summary"
    enabled: true
  - id: "skills"
    enabled: true
  - id: "projects"
    enabled: true
  - id: "courses"
    enabled: true
  - id: "work_experience"
    enabled: true
  - id: "education"
    enabled: true
  - id: "publications"
    enabled: false

# --------------------------------------------
# Profile Information
# --------------------------------------------
profile:
  name: "Mohamed Sallam"
  title: "Back-end Engineer"
  photo: "https://avatars.githubusercontent.com/u/59128458"
  summary: |
    A fresh Computer & Systems Engineering graduate with a strong foundation in software engineering 
    fundamentals—clean code, robust architecture, design patterns, and solving complex problems with 
    clarity and simplicity. I've built a front-end authoring tool for a nationally funded LLMS project, 
    developed reusable Qt/C++ and PySide2 components for ADT used by thousands worldwide, and contributed 
    to migrating legacy systems across Python, PySide2, Qt/C++, and Spring/Java. I also developed simple 
    backend CRUD systems during a Java/Spring Boot bootcamp, applying clean architecture principles and 
    design patterns.

# --------------------------------------------
# Skills Configuration
# --------------------------------------------
skills:
  # If true, skills are auto-generated from tags in projects, courses, etc.
  auto_generate: true
  # Maximum number of skills to display
  max_count: 20
  # Override with manual list (only used if auto_generate is false or as fallback)
  manual_skills:
    - Java
    - Spring Boot
    - Python
    - C++
    - Qt
    - Design Patterns
    - Clean Architecture
    - REST APIs
    - Git/GitHub
    - Object-Oriented Design

